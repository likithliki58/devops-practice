apiVersion: apps/v1
kind: ReplicaSet

metadata:
  name: devops-app-rs

spec:
  replicas: 3

  selector:
    matchLabels:
      app: devops-app

  template:
    metadata:
      labels:
        app: devops-app

    spec:
      containers:
        - name: devops-app
          image: devops-app:1.0
          ports:
            - containerPort: 5000
